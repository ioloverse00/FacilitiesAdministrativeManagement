<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Page Not Found</title>
    <base href="/">
    <link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg" />
    <script src="/assets/js/theme.js"></script>
    <link href="/assets/css/app.css" rel="stylesheet">
    <script src="/assets/js/navigation.js" defer></script>
    <script src="/assets/js/sidebar.js" defer></script>
    <script src="/assets/js/profile-dropdown.js" defer></script>
    <script src="/assets/js/modal.js" defer></script>
    <script src="/assets/js/layout.js" defer></script>
</head>
<body class="app-body bg-background text-on-background font-body"
    data-app-base-path="/"
    data-page-title="Page Not Found"
    data-breadcrumb-title="Page Not Found"
    data-active-nav=""
    data-page-heading="Page Not Found"
    data-page-description="The requested page could not be found.">
    <div id="app-shell" class="app-shell">
        <div id="app-sidebar-slot" class="app-sidebar-slot"></div>
        <div class="app-main-panel">
            <div id="app-header-slot" class="shrink-0"></div>
            <main id="app-content" class="app-main bg-surface-container-lowest">
                <div id="page-content" class="app-page-content facility-requests-workspace admin-maintenance-workspace">
                    <div class="facility-requests-shell">
                        <section class="facility-section" aria-labelledby="not-found-title">
                            <article class="fam-card admin-maintenance-card" role="status" aria-live="polite">
                                <span class="admin-maintenance-icon material-symbols-outlined" aria-hidden="true">search_off</span>
                                <div class="admin-maintenance-copy">
                                    <h2 id="not-found-title">Page Not Found</h2>
                                    <p>The page you're looking for could not be found or may have been moved.</p>
                                </div>
                                <a class="btn-primary dashboard-action-button" href="/dashboard" data-clean-route="dashboard">
                                    <span class="material-symbols-outlined" aria-hidden="true">dashboard</span>
                                    Back to Dashboard
                                </a>
                            </article>
                        </section>
                    </div>
                </div>
                <div id="app-footer-slot" class="app-footer-slot"></div>
            </main>
        </div>
    </div>
</body>
</html>
