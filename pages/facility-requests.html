<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Facility Requests</title>
    <script src="../assets/js/theme.js"></script>
    <link href="../assets/css/app.css" rel="stylesheet">
    <script src="../assets/js/navigation.js" defer></script>
    <script src="../assets/js/sidebar.js" defer></script>
    <script src="../assets/js/profile-dropdown.js" defer></script>
    <script src="../assets/js/modal.js" defer></script>
    <script src="../assets/js/layout.js" defer></script>
    <script src="../assets/js/api-client.js" defer></script>
    <script src="../assets/js/table-audit.js" defer></script>
    <script src="../assets/js/facility-requests.js" defer></script>
</head>
<body class="app-body bg-background text-on-background font-body"
    data-page-title="Facility Requests"
    data-breadcrumb-title="Facility Requests"
    data-active-nav="facilities"
    data-page-heading="Facility Requests"
    data-page-description="Manage facility service requests, assignments, approvals, and request lifecycle.">
    <div id="app-shell" class="app-shell">
        <div id="app-sidebar-slot" class="app-sidebar-slot"></div>
        <div class="app-main-panel">
            <div id="app-header-slot" class="shrink-0"></div>
            <main id="app-content" class="app-main bg-surface-container-lowest">
                <div id="page-content" class="app-page-content facility-requests-workspace">
                    <div class="facility-requests-shell">
                        <header class="facility-page-header">
                            <div class="facility-title-block">
                                <h1>Facility Requests</h1>
                                <p>Manage facility service requests, assignments, approvals, and request lifecycle.</p>
                                <span id="facility-requests-updated" class="fam-last-updated">Last updated: Loading...</span>
                            </div>
                            <div class="facility-header-actions">
                                <button id="facility-refresh" class="fam-icon-button" type="button" aria-label="Refresh facility requests">
                                    <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
                                </button>
                                <button id="facility-export" class="btn-primary dashboard-action-button" type="button">
                                    <span class="material-symbols-outlined" aria-hidden="true">download</span>
                                    Export
                                </button>
                            </div>
                        </header>

                        <section class="facility-section" aria-labelledby="open-requests-title">
                            <div class="facility-table-card">
                                <div class="facility-table-header">
                                    <div>
                                        <h2 id="open-requests-title">Open Requests</h2>
                                        <p id="facility-table-count">Loading requests...</p>
                                    </div>
                                    <div class="facility-header-controls">
                                        <label class="facility-field facility-search-field">
                                            <span class="sr-only">Search</span>
                                            <input id="facility-search" type="search" placeholder="Search requests...">
                                        </label>
                                        <button id="facility-reset-filters" class="facility-text-button hidden" type="button">Reset Filters</button>
                                    </div>
                                </div>
                                <div id="facility-loading-state" class="fam-state">
                                    <span class="material-symbols-outlined" aria-hidden="true">progress_activity</span>
                                    <span>Loading facility requests...</span>
                                </div>
                                <div class="facility-table-scroll">
                                    <table class="facility-requests-table">
                                        <colgroup>
                                            <col class="table-col-reference">
                                            <col class="table-col-subject">
                                            <col class="table-col-category">
                                            <col class="table-col-priority">
                                            <col class="table-col-status">
                                            <col class="table-col-datetime">
                                            <col class="table-col-actions">
                                        </colgroup>
                                        <thead>
                                            <tr>
                                                <th><button type="button" class="facility-sort-button" data-sort="requestNo">Request No.</button></th>
                                                <th><button type="button" class="facility-sort-button" data-sort="subject">Subject</button></th>
                                                <th data-column="category"></th>
                                                <th data-column="priority"></th>
                                                <th data-column="status"></th>
                                                <th data-column="submitted"></th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="facility-requests-table"></tbody>
                                    </table>
                                </div>
                                <div id="facility-empty-state" class="facility-empty-state hidden" aria-live="polite"></div>
                                <div class="facility-pagination" aria-label="Facility request pagination">
                                    <button id="facility-prev-page" class="facility-page-button" type="button">Previous</button>
                                    <span id="facility-page-status">Page 1 of 1</span>
                                    <button id="facility-next-page" class="facility-page-button" type="button">Next</button>
                                </div>
                            </div>
                        </section>

                        <aside id="facility-request-drawer" class="facility-drawer-placeholder" aria-label="Request details drawer placeholder" hidden>
                            <div data-drawer-section="general-information"></div>
                            <div data-drawer-field="requester"></div>
                            <div data-drawer-field="department"></div>
                            <div data-drawer-field="location"></div>
                            <div data-drawer-section="description"></div>
                            <div data-drawer-section="attachments"></div>
                            <div data-drawer-section="timeline"></div>
                            <div data-drawer-section="approval-history"></div>
                            <div data-drawer-section="sla"></div>
                            <div data-drawer-section="ai-recommendation"></div>
                            <div data-ai-field="suggested-priority"></div>
                            <div data-ai-field="suggested-category"></div>
                            <div data-ai-field="suggested-team"></div>
                            <div data-ai-field="confidence-score"></div>
                            <div data-ai-field="explanation"></div>
                            <div data-ai-field="decision"></div>
                            <div data-drawer-section="activity-log"></div>
                            <div data-drawer-section="related-maintenance-work-order"></div>
                        </aside>
                    </div>
                </div>
                <div id="app-footer-slot" class="app-footer-slot"></div>
            </main>
        </div>
    </div>
    <div id="dash-toast-container" class="fixed bottom-6 right-6 z-50 grid gap-3 pointer-events-none"></div>
</body>
</html>
