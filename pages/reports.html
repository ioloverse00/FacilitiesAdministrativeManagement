<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Reports &amp; Analytics - FAM</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg" />
    <script src="../assets/js/theme.js"></script>
    <link href="../assets/css/app.css" rel="stylesheet">
    <script src="../assets/js/api-client.js" defer></script>
    <script src="../assets/vendor/chartjs/chart.umd.min.js" defer></script>
    <script src="../assets/js/navigation.js" defer></script>
    <script src="../assets/js/sidebar.js" defer></script>
    <script src="../assets/js/profile-dropdown.js" defer></script>
    <script src="../assets/js/modal.js" defer></script>
    <script src="../assets/js/layout.js" defer></script>
    <script src="../assets/js/reports.js" defer></script>
</head>
<body class="app-body bg-background text-on-background font-body"
    data-page-title="Reports & Analytics"
    data-breadcrumb-title="Reports & Analytics"
    data-active-nav="reports"
    data-page-heading="Reports & Analytics"
    data-page-description="Centralized reporting, analytics, and exports over live FAM operational data."
    data-requires-permission="reports.view">
    <div id="app-shell" class="app-shell">
        <div id="app-sidebar-slot" class="app-sidebar-slot"></div>
        <div class="app-main-panel">
            <div id="app-header-slot" class="shrink-0"></div>
            <main id="app-content" class="app-main bg-surface-container-lowest">
                <div id="page-content" class="app-page-content reports-workspace">
                    <section class="reports-shell" aria-labelledby="reports-title">
                        <header class="facility-page-header reports-page-header">
                            <div class="facility-title-block">
                                <h1 id="reports-title">Reports &amp; Analytics</h1>
                                <p>Centralized reporting, analytics, and exports over live FAM operational data.</p>
                                <span id="reports-updated" class="fam-last-updated">Last updated: Loading...</span>
                            </div>
                            <div class="facility-header-actions">
                                <button id="reports-refresh" class="fam-icon-button" type="button" aria-label="Refresh reports">
                                    <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
                                </button>
                            </div>
                        </header>
                        <div class="facility-table-card reports-control-card">
                            <div id="reports-tabs" class="reports-tabs" role="tablist" aria-label="Report domains"></div>
                            <form id="reports-filters" class="reports-filter-grid" autocomplete="off">
                                <label data-filter="source"><span>Source</span><select name="source"></select></label>
                                <label data-filter="date_basis"><span>Date Basis</span><select name="date_basis"></select></label>
                                <label data-filter="date_from"><span>From</span><input type="date" name="date_from"></label>
                                <label data-filter="date_to"><span>To</span><input type="date" name="date_to"></label>
                                <label data-filter="status"><span>Status</span><select name="status"></select></label>
                                <label data-filter="priority"><span>Priority</span><select name="priority"></select></label>
                                <label data-filter="type"><span>Type</span><select name="type"></select></label>
                                <label data-filter="confidentiality"><span>Confidentiality</span><select name="confidentiality"></select></label>
                                <label data-filter="department_id"><span>Department</span><select name="department_id"></select></label>
                                <label data-filter="category_id"><span>Category</span><select name="category_id"></select></label>
                                <label data-filter="type_id"><span>Contract Type</span><select name="type_id"></select></label>
                                <label data-filter="retention_schedule_id"><span>Retention Schedule</span><select name="retention_schedule_id"></select></label>
                                <label data-filter="retention_state"><span>Retention State</span><select name="retention_state"></select></label>
                                <label data-filter="assignee_id"><span>Assignee</span><select name="assignee_id"></select></label>
                                <div class="reports-filter-actions">
                                    <button id="reports-reset" class="btn-secondary dashboard-action-button" type="button">Reset</button>
                                    <button class="btn-primary dashboard-action-button" type="submit">Apply Filters</button>
                                </div>
                            </form>
                            <div id="reports-error" class="facility-form-error" role="alert" hidden></div>
                        </div>
                        <div id="reports-loading-state" class="fam-state hidden" aria-live="polite"><span class="material-symbols-outlined" aria-hidden="true">progress_activity</span><span>Loading report data...</span></div>
                        <section id="reports-panel" aria-live="polite"></section>
                    </section>
                </div>
                <div id="app-footer-slot" class="app-footer-slot"></div>
            </main>
        </div>
    </div>
</body>
</html>
