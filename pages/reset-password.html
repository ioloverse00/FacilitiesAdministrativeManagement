<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="referrer" content="no-referrer">
    <title>Set Account Password</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
    <script>
    (() => {
        const url = new URL(window.location.href);
        window.__accountSetupToken = url.searchParams.get('token') || '';
        if (url.searchParams.has('token')) {
            url.searchParams.delete('token');
            window.history.replaceState({}, document.title, `${url.pathname}${url.search}${url.hash}`);
        }
    })();
    </script>
    <script src="../assets/js/theme.js"></script>
    <link href="../assets/css/app.css" rel="stylesheet">
    <script src="../assets/js/app.js" defer></script>
</head>
<body class="auth-shell">
    <main class="auth-card" aria-labelledby="setup-title">
        <div class="auth-header">
            <img src="../assets/logo-icon.svg" alt="Great Solomon Manpower Services Inc." class="mx-auto mb-4 h-20 w-20" loading="eager">
            <h1 class="auth-title" id="setup-title">Set Your Password</h1>
            <p class="auth-subtitle" id="setup-subtitle">Checking setup link...</p>
        </div>

        <form class="space-y-6" id="setup-password-form" data-account-setup-form hidden>
            <div>
                <label class="block label-text text-sm font-medium text-on-surface-variant mb-1.5" for="new-password">New password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                        <span class="material-symbols-outlined text-xl" aria-hidden="true">lock</span>
                    </div>
                    <input class="block w-full pl-10 pr-3 py-2.5 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 focus:ring-2 focus:ring-primary focus:border-primary transition-colors sm:text-sm" id="new-password" name="password" type="password" autocomplete="new-password" required minlength="12">
                </div>
                <p class="mt-1.5 text-xs text-outline">Use at least 12 characters with uppercase, lowercase, and a number.</p>
            </div>

            <div>
                <label class="block label-text text-sm font-medium text-on-surface-variant mb-1.5" for="confirm-password">Confirm password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                        <span class="material-symbols-outlined text-xl" aria-hidden="true">lock_clock</span>
                    </div>
                    <input class="block w-full pl-10 pr-3 py-2.5 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 focus:ring-2 focus:ring-primary focus:border-primary transition-colors sm:text-sm" id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required minlength="12">
                </div>
            </div>

            <div id="setup-error" class="facility-form-error" role="alert" aria-live="polite" hidden></div>

            <button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-[0.98]" type="submit">
                Set Password
            </button>
        </form>

        <div id="setup-state" class="facility-form-error" role="status" aria-live="polite"></div>

        <div class="mt-6 text-center">
            <a class="text-sm font-medium text-primary-container hover:text-primary transition-colors" href="login.html" id="back-to-login-link">Back to sign in</a>
        </div>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const token = window.__accountSetupToken || '';
        const form = document.getElementById('setup-password-form');
        const state = document.getElementById('setup-state');
        const subtitle = document.getElementById('setup-subtitle');
        const errorBox = document.getElementById('setup-error');
        const button = form?.querySelector('button[type="submit"]');
        const apiUrl = '../api/auth/setup-password.php';

        const showState = message => {
            if (state) {
                state.hidden = false;
                state.textContent = message;
            }
        };

        const showError = message => {
            if (errorBox) {
                errorBox.hidden = false;
                errorBox.textContent = message;
            }
        };

        if (!token) {
            if (subtitle) subtitle.textContent = 'This setup link is missing a token.';
            showState('Request a new account setup link from a FAM Super Admin.');
            return;
        }

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'status', token })
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.data?.valid !== true) throw new Error('This setup link is invalid, expired, or already used.');
            if (subtitle) subtitle.textContent = 'Choose a password for your account.';
            if (state) state.hidden = true;
            if (form) form.hidden = false;
        } catch (error) {
            if (subtitle) subtitle.textContent = 'Setup link unavailable.';
            showState(error.message || 'This setup link is invalid, expired, or already used.');
            return;
        }

        form?.addEventListener('submit', async event => {
            event.preventDefault();
            if (errorBox) {
                errorBox.hidden = true;
                errorBox.textContent = '';
            }
            if (button) {
                button.disabled = true;
                button.textContent = 'Setting password...';
            }
            const formData = new FormData(form);
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token,
                        password: String(formData.get('password') || ''),
                        confirm_password: String(formData.get('confirm_password') || '')
                    })
                });
                const payload = await response.json().catch(() => null);
                if (!response.ok || payload?.success === false) {
                    const errors = payload?.data?.errors || {};
                    throw new Error(Object.values(errors)[0] || payload?.message || 'Password setup failed.');
                }
                form.hidden = true;
                if (subtitle) subtitle.textContent = 'Password setup complete.';
                showState('Your account is ready. Sign in with your new password.');
            } catch (error) {
                showError(error.message || 'Password setup failed.');
            } finally {
                if (button) {
                    button.disabled = false;
                    button.textContent = 'Set Password';
                }
            }
        });
    });
    </script>
</body>
</html>
