<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg" />
    <script src="../assets/js/theme.js"></script>
<link rel="stylesheet" href="../assets/css/app.css" />
    <script src="../assets/js/app.js?v=employee-portal-routing-20260824" defer></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Public+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
    />
</head>

<body class="auth-shell">
    <div class="auth-card">
        <div class="auth-header">
            <img src="../assets/logo-icon.svg" alt="Great Solomon Manpower Services Inc." class="mx-auto mb-4 h-20 w-20" loading="eager">
            <h1 class="auth-title">Sign In</h1>
            <p class="auth-subtitle">Great Solomon Manpower Services Inc.</p>
        </div>

        <form class="space-y-6" data-auth-form>
            <!-- Email Field -->
            <div>
                <label class="block label-text text-sm font-medium text-on-surface-variant mb-1.5" for="email">Username or Email
                    Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                        <span class="material-symbols-outlined text-xl" data-icon="mail">mail</span>
                    </div>
                    <input
                        class="block w-full pl-10 pr-3 py-2.5 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 focus:ring-2 focus:ring-primary focus:border-primary transition-colors sm:text-sm"
                        id="email" name="username" placeholder="gsms-super-admin" required="" type="text" />
                </div>
            </div>
            <!-- Password Field -->
            <div>
                <label class="block label-text text-sm font-medium text-on-surface-variant mb-1.5"
                    for="password">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                        <span class="material-symbols-outlined text-xl" data-icon="lock">lock</span>
                    </div>
                    <input
                        class="block w-full pl-10 pr-10 py-2.5 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 focus:ring-2 focus:ring-primary focus:border-primary transition-colors sm:text-sm"
                        id="password" name="password" data-password-input
                        placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required=""
                        type="password" />
                    <button
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors"
                        data-password-toggle type="button">
                        <span class="material-symbols-outlined text-xl" data-icon="visibility"
                            id="visibility-icon" data-visibility-icon>visibility</span>
                    </button>
                </div>
            </div>
            <!-- Options Row -->
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input
                        class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-lowest"
                        id="remember-me" name="remember-me" type="checkbox" />
                    <label class="ml-2 block text-sm text-on-surface-variant label-text" for="remember-me">
                        Remember me
                    </label>
                </div>
                <div class="text-sm">
                    <a class="font-medium text-primary hover:text-primary-container transition-colors label-text"
                        href="forgot-password.html" id="forgot-password-link">
                        Forgot password?
                    </a>
                </div>
            </div>
            <div id="auth-error" class="facility-form-error" role="alert" aria-live="polite" hidden></div>            <!-- Submit Button -->
            <div>
                <button
                    class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-[0.98]"
                    type="submit">
                    Sign In
                </button>
            </div>
        </form>
    </div>
</body>
</html>
