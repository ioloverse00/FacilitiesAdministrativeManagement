<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>My Notifications</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/logo-icon.svg" />
    <script src="../../assets/js/theme.js"></script>
    <link href="../../assets/css/app.css" rel="stylesheet">
    <script src="../../assets/js/api-client.js" defer></script>
    <script src="../../assets/js/navigation.js" defer></script>
    <script src="../../assets/js/sidebar.js" defer></script>
    <script src="../../assets/js/profile-dropdown.js" defer></script>
    <script src="../../assets/js/modal.js" defer></script>
    <script src="../../assets/js/employee/portal.js" defer></script>
    <script src="../../assets/js/employee/notifications.js" defer></script>
</head>
<body class="app-body bg-background text-on-background font-body employee-portal-body" data-active-nav="employee-notifications" data-page-title="My Notifications" data-page-heading="Notifications" data-page-description="Updates about your requests and reservations.">
    <div id="app-shell" class="app-shell"><div id="app-sidebar-slot" class="app-sidebar-slot"></div><div class="app-main-panel"><div id="app-header-slot" class="shrink-0"></div><main id="app-content" class="app-main bg-surface-container-lowest"><div id="page-content" class="app-page-content employee-workspace"><div class="employee-shell">
        <header class="employee-page-header">
            <div>
                <h1 id="page-heading">Notifications</h1>
                <p id="page-description">Updates about your requests and reservations.</p>
            </div>
        </header>
        <section class="fam-section" aria-labelledby="notifications-title">
            <div class="facility-table-card employee-notifications-card">
                <div class="employee-records-header employee-notifications-header">
                    <div>
                        <h2 id="notifications-title">Updates</h2>
                        <p>Recent changes that belong to your account.</p>
                    </div>
                    <div class="employee-notifications-toolbar">
                        <div class="employee-filter-pills" role="group" aria-label="Notification filters">
                            <button type="button" class="active" data-employee-notification-filter="all" aria-pressed="true">All</button>
                            <button type="button" data-employee-notification-filter="unread" aria-pressed="false">Unread</button>
                            <button type="button" data-employee-notification-filter="read" aria-pressed="false">Read</button>
                        </div>
                        <button type="button" class="facility-link-button" data-employee-notifications-mark-all>Mark all as read</button>
                    </div>
                </div>
                <div id="employee-notifications-state" class="employee-placeholder-card employee-notifications-state" aria-live="polite"></div>
            </div>
        </section>
    </div></div><div id="app-footer-slot" class="app-footer-slot"></div></main></div></div>
</body>
</html>
