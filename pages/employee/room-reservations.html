<body class="app-body bg-background text-on-background font-body employee-portal-body" data-active-nav="employee-room-reservations" data-page-title="My Reservations" data-page-heading="My Reservations" data-page-description="Track your room reservation history and requester actions.">
    <div id="app-shell" class="app-shell"><div id="app-sidebar-slot" class="app-sidebar-slot"></div><div class="app-main-panel"><div id="app-header-slot" class="shrink-0"></div><main id="app-content" class="app-main bg-surface-container-lowest"><div id="page-content" class="app-page-content employee-workspace"><div class="employee-shell">
        <header class="facility-page-header employee-request-page-header"><div class="facility-title-block"><h1 id="page-heading">My Reservations</h1><p id="page-description">Track your room reservation history and requester actions.</p></div><div class="facility-header-actions"><a class="btn-primary dashboard-action-button" href="../employee/request-room" data-clean-route="employee-request-room"><span class="material-symbols-outlined" aria-hidden="true">add_circle</span>Request Room</a></div></header>
