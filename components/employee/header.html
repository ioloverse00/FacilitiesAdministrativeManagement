<header class="bg-surface/80 backdrop-blur-md shadow-sm border-b border-outline-variant/30 flex justify-between items-center h-16 px-6 w-full z-30 shrink-0">
    <div class="flex items-center gap-3">
        <button id="desktop-sidebar-toggle" type="button" class="flex items-center justify-center p-2 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low focus:outline-none transition border border-outline-variant/30 shrink-0 min-w-[2.5rem] min-h-[2.5rem]" title="Close Sidebar" aria-label="Toggle employee navigation" aria-controls="app-sidebar" aria-expanded="true">
            <span class="material-symbols-outlined text-xl" id="sidebar-toggle-icon" aria-hidden="true">menu_open</span>
        </button>
        <div class="hidden sm:block">
            <p id="employee-header-page" class="text-sm font-semibold text-on-surface">Employee Portal</p>
            <p id="employee-header-department" class="text-xs text-on-surface-variant">Loading department...</p>
        </div>
    </div>

    <div class="flex items-center gap-2">
        <div class="notification-center relative">
            <button id="notification-dropdown-toggle" type="button" class="notification-bell-button" aria-expanded="false" aria-controls="notification-dropdown-menu" aria-haspopup="dialog" aria-label="Open notifications" title="Notifications">
                <span class="material-symbols-outlined text-xl" aria-hidden="true">notifications</span>
                <span id="notification-unread-count" class="notification-unread-badge hidden" aria-hidden="true">0</span>
            </button>

            <section id="notification-dropdown-menu" class="notification-dropdown-menu hidden opacity-0 scale-95" aria-labelledby="notification-dropdown-title" role="dialog">
                <div class="notification-panel-header">
                    <div>
                        <h2 id="notification-dropdown-title">Notifications</h2>
                        <p id="notification-unread-summary">0 unread</p>
                    </div>
                    <div class="notification-panel-actions">
                        <button type="button" id="notification-mark-all-read">Mark all as read</button>
                        <a href="notifications.html">View All</a>
                    </div>
                </div>
                <input id="notification-search-hook" class="sr-only" type="search" aria-label="Search notifications" tabindex="-1" data-future-filter="search">
                <div class="notification-tabs" role="tablist" aria-label="Notification filters">
                    <button type="button" class="active" data-notification-filter="all" role="tab" aria-selected="true">All</button>
                    <button type="button" data-notification-filter="unread" role="tab" aria-selected="false">Unread</button>
                    <button type="button" data-notification-filter="read" role="tab" aria-selected="false">Read</button>
                </div>
                <div id="notification-list" class="notification-list" data-module-filter="" data-priority-filter="" data-date-filter=""></div>
            </section>
        </div>

        <div class="relative flex items-center">
            <button id="profile-dropdown-toggle" type="button" class="flex items-center gap-3 p-1.5 rounded-full hover:bg-surface-container-low transition-colors focus:outline-none border border-transparent hover:border-outline-variant/30 cursor-pointer" aria-expanded="false" aria-controls="profile-dropdown-menu" aria-haspopup="menu" aria-label="Open account menu" title="Account Menu">
                <div id="employee-header-avatar" class="w-9 h-9 rounded-full bg-primary-container/30 border border-primary/20 flex items-center justify-center text-primary font-bold text-sm shadow-2xs shrink-0" aria-hidden="true">EP</div>
                <div class="hidden md:flex flex-col text-left mr-1">
                    <span id="employee-header-name" class="font-label font-semibold text-sm text-on-surface leading-tight">Employee</span>
                    <span id="employee-header-position" class="text-xs text-on-surface-variant font-light">Requester</span>
                </div>
                <span class="material-symbols-outlined text-on-surface-variant text-sm hidden sm:inline-block" aria-hidden="true">expand_more</span>
            </button>

            <div id="profile-dropdown-menu" class="absolute right-0 top-14 w-60 bg-surface rounded-2xl shadow-xl border border-outline-variant/30 py-2 z-50 transition-all duration-200 hidden opacity-0 scale-95 origin-top-right" role="menu">
                <div class="px-4 py-3 border-b border-outline-variant/20 md:hidden">
                    <p id="employee-menu-name" class="text-sm font-semibold text-on-surface">Employee</p>
                    <p id="employee-menu-email" class="text-xs text-on-surface-variant truncate">Loading...</p>
                </div>
                <div class="px-4 py-2 hidden md:block">
                    <p class="text-xs font-medium text-on-surface-variant uppercase tracking-wider">Account</p>
                </div>
                <a href="profile.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-on-surface hover:bg-surface-container-low hover:text-primary transition-colors" role="menuitem">
                    <span class="material-symbols-outlined text-lg text-on-surface-variant" aria-hidden="true">person</span>
                    <span class="font-medium">My Profile</span>
                </a>
                <!-- Dark Mode temporarily disabled pending post-core-UAT visual validation. -->
                <div class="my-1 border-t border-outline-variant/20"></div>
                <button type="button" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors font-medium cursor-pointer" data-auth-logout role="menuitem">
                    <span class="material-symbols-outlined text-lg" aria-hidden="true">logout</span>
                    <span>Log Out</span>
                </button>
            </div>
        </div>
    </div>
</header>
